[project]
name = "python-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "stevecyj", email = "ycsteven.tsao@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "jupyterlab>=4.6.2",
    "lxml>=6.1.2",
    "mysqlclient>=2.2.8",
    "notebook>=7.6.1",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
]

[project.scripts]
python-course = "python_course:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# 專案在 /Volumes/data，uv 快取在 ~/.cache，跨檔案系統無法 hardlink／clone。
# 明確指定 copy，避免每次 uv sync 都跳 fallback 警告。
link-mode = "copy"
